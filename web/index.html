<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f2e9" />
    <meta name="description" content="旅の途中で寄りたい道の駅を探せるガイド" />
    <title>よりみち道の駅</title>
    <style>
      .global-nav-links {
        position: fixed;
        right: 16px;
        bottom: 18px;
        z-index: 50;
        display: flex;
        gap: 8px;
      }
      .global-nav-link {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 12px 16px;
        border-radius: 999px;
        background: #31543d;
        color: #fff;
        text-decoration: none;
        font: 700 13px system-ui, sans-serif;
        box-shadow: 0 8px 24px rgba(31, 42, 35, .22);
      }
      .global-nav-link.photo { background: #8c5f3d; }
      .global-nav-link:hover { transform: translateY(-1px); }
      @media (max-width: 640px) {
        .global-nav-links { left: 12px; right: 12px; }
        .global-nav-link { flex: 1; justify-content: center; padding: 11px 10px; font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <nav class="global-nav-links" aria-label="道の駅の探し方">
      <a class="global-nav-link photo" href="./explore.html">▣ 写真から探す</a>
      <a class="global-nav-link" href="./map.html">⌖ 地図から探す</a>
    </nav>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
